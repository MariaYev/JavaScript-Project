<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery</title>
    <link rel="stylesheet" href="style-password-recovery.css">
    <script src="password-recovery.js" defer></script>
</head>
<body>
    <h1>Password Recovery</h1>
    <form class="recovery-form">
        <div>
            <label for="recovery-email">Email:</label>
            <input type="email" id="recovery-email" name="email" placeholder="myemail@example.com" required>
        </div>
        <button type="submit">Send Reset Link</button>
    </form>
</body>
</html>
