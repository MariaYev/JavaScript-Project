<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-register.css">
    <script src="register.js" defer></script>
    <title>Register</title>
</head>
<body>
    <h1>Register</h1>
    <form class="register-form">
        <div>
            <label for="reg-username">Username or email:</label>
            <input type="text" id="reg-username" name="username" placeholder="myuser123" required>
        </div>

        <div>
            <label for="reg-email">Email:</label>
            <input type="email" id="reg-email" name="email" placeholder="myemail@example.com" required>
        </div>

        <div>
            <label for="reg-password">Password:</label>
            <input type="password" id="reg-password" name="password" placeholder="Password123$" required>
        </div>

        <button type="submit">Register</button>
    </form>
</body>
</html>
